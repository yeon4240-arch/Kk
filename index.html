<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Gourmet & Travel Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen font-sans">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold flex items-center gap-2 text-red-500">
                <i data-lucide="compass"></i> 일본 여행 플래너 (실시간 편집 모드)
            </h1>
            <div class="flex flex-wrap items-center justify-center gap-2">
                <button onclick="backupData()" class="bg-gray-800 hover:bg-gray-900 text-white font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1 shadow-sm transition-all">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> 백업 파일 저장
                </button>
                <button onclick="document.getElementById('restore-file-input').click()" class="bg-gray-600 hover:bg-gray-700 text-white font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1 shadow-sm transition-all">
                    <i data-lucide="upload" class="w-3.5 h-3.5"></i> 백업 복구 (가져오기)
                </button>
                <input type="file" id="restore-file-input" class="hidden" accept=".json,.txt" onchange="restoreData(event)">

                <span class="text-gray-300">|</span>

                <button onclick="openAddModal()" class="bg-red-500 hover:bg-red-600 text-white font-bold px-4 py-2 rounded-xl text-sm flex items-center gap-1.5 shadow-md transition-all">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> 장소 추가
                </button>
                <div id="location-status" class="flex items-center gap-2 bg-gray-100 text-gray-600 px-4 py-2 rounded-full text-sm font-medium">
                    <i data-lucide="map-pin" class="text-gray-400"></i>
                    <span>위치 확인 중...</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <div class="flex border-b border-gray-200 mb-6">
            <button onclick="switchMainCategory('restaurant')" id="main-tab-restaurant" class="px-6 py-3 font-bold text-base border-b-2 border-red-500 text-red-600 flex items-center gap-2 transition-all">
                <i data-lucide="utensils-crossed" class="w-4 h-4"></i> 맛집 탐방 🍽️
            </button>
            <button onclick="switchMainCategory('spot')" id="main-tab-spot" class="px-6 py-3 font-bold text-base border-b-2 border-transparent text-gray-500 hover:text-gray-900 flex items-center gap-2 transition-all">
                <i data-lucide="map" class="w-4 h-4"></i> 추천 관광지 🗺️
            </button>
        </div>

        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div class="flex bg-gray-200 p-1 rounded-xl w-fit" id="city-tabs">
                <button onclick="switchCity('nagoya')" id="tab-nagoya" class="px-6 py-2.5 rounded-lg text-sm font-bold transition-all bg-white text-gray-900 shadow-sm">
                    나고야 🏯
                </button>
                <button onclick="switchCity('osaka')" id="tab-osaka" class="px-6 py-2.5 rounded-lg text-sm font-bold transition-all text-gray-500 hover:text-gray-900">
                    오사카 🐙
                </button>
            </div>

            <div class="flex gap-2" id="category-filters">
                <button onclick="filterCategory('all')" id="filter-all" class="px-4 py-2 rounded-lg text-xs font-bold border border-red-500 bg-red-50 text-red-600 transition-all">전체</button>
                <button onclick="filterCategory('food')" id="filter-food" class="px-4 py-2 rounded-lg text-xs font-bold border border-gray-200 bg-white text-gray-600 hover:border-gray-300 transition-all">식사</button>
                <button onclick="filterCategory('dessert')" id="filter-dessert" class="px-4 py-2 rounded-lg text-xs font-bold border border-gray-200 bg-white text-gray-600 hover:border-gray-300 transition-all">디저트/카페</button>
            </div>
        </div>

        <div id="card-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <div id="add-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
            <div class="bg-gray-950 text-white p-4 flex justify-between items-center">
                <h2 class="font-bold flex items-center gap-1.5"><i data-lucide="plus-circle" class="text-red-400"></i> 새로운 장소 추가하기</h2>
                <button onclick="closeAddModal()" class="text-gray-400 hover:text-white transition-colors"><i data-lucide="x"></i></button>
            </div>
            <div class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">대상 도시</label>
                    <select id="form-city" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
                        <option value="nagoya">나고야 🏯</option>
                        <option value="osaka">오사카 🐙</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">대분류 및 유형</label>
                    <select id="form-category" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
                        <option value="food">맛집 탐방 ➔ 식사 🍽️</option>
                        <option value="dessert">맛집 탐방 ➔ 디저트/카페 ☕</option>
                        <option value="spot">추천 관광지 🗺️</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">장소/매장 이름</label>
                    <input type="text" id="form-name" placeholder="예: 신파치 식당 난바점" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">구글맵 평점 (0.0 ~ 5.0)</label>
                    <input type="number" id="form-rating" step="0.1" min="0" max="5" value="4.5" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">한줄 소개 (대표 메뉴 또는 특징)</label>
                    <input type="text" id="form-subinfo" placeholder="예: 생선구이가 맛있는 가성비 아침식사 식당" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">예상 비용 또는 입장료</label>
                    <input type="text" id="form-price" placeholder="예: ￥800 ~ ￥1,500" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">위도 (Lat) - 생략가능</label>
                        <input type="number" id="form-lat" step="0.0001" placeholder="34.6687" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">경도 (Lng) - 생략가능</label>
                        <input type="number" id="form-lng" step="0.0001" placeholder="135.5013" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
                    </div>
                </div>
            </div>
            <div class="p-4 bg-gray-50 border-t border-gray-100 flex gap-2">
                <button onclick="closeAddModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 rounded-xl text-sm transition-colors">취소</button>
                <button onclick="submitNewPlace()" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-xl text-sm transition-colors shadow-sm">등록하기</button>
            </div>
        </div>
    </div>

                    { id: "n_s10", name: "아츠타 신궁", category: "spot", rating: 4.4, subInfo: "울창한 삼나무 숲에 둘러싸인 조용한 대형 신사", price: "무료 입장", lat: 35.1257, lng: 136.9091, img: "https://images.unsplash.com/photo-1601058334415-373f76da05f3?auto=format&fit=crop&w=600&q=80" }
                ],
                osaka: [
                    { id: "o_s1", name: "도톤보리", category: "spot", rating: 4.7, subInfo: "글리코상 전광판 인증샷 필수인 화려한 오사카 중심가", price: "자유 관광", lat: 34.6687, lng: 135.5013, img: "https://images.unsplash.com/photo-1590559899731-a3828dfc515c?auto=format&fit=crop&w=600&q=80" },
                    { id: "o_s2", name: "오사카 성", category: "spot", rating: 4.6, subInfo: "거대한 성곽และ 아름다운 정원이 펼쳐진 랜드마크", price: "천수각 ￥600", lat: 34.6873, lng: 135.5262, img: "https://images.unsplash.com/photo-1569429545934-8c886ca48df3?auto=format&fit=crop&w=600&q=80" },
                    { id: "o_s3", name: "유니버설 스튜디오 재팬 (USJ)", category: "spot", rating: 4.9, subInfo: "닌텐도 월드와 해리포터 등 최고의 영화 어트랙션 파크", price: "패스권 변동", lat: 34.6654, lng: 135.4323, img: "https://images.unsplash.com/photo-1642177303023-e7f09bf2187b?auto=format&fit=crop&w=600&q=80" },
                    { id: "o_s4", name: "우메다 스카이 빌딩", category: "spot", rating: 4.6, subInfo: "360도 야경을 탁 트인 야외에서 감상하는 공중정원", price: "입장료 ￥1,500", lat: 34.7053, lng: 135.4904, img: "https://images.unsplash.com/photo-1545249390-6bdfa286032f?auto=format&fit=crop&w=600&q=80" },
                    { id: "o_s5", name: "하루카스 300", category: "spot", rating: 4.8, subInfo: "일본 초고층 통유리창으로 오사카 전체를 품는 곳", price: "입장료 ￥2,000", lat: 34.6458, lng: 135.5139, img: "https://images.unsplash.com/photo-1545249390-6bdfa286032f?auto=format&fit=crop&w=600&q=80" },
                    { id: "o_s6", name: "카이유칸 수족관", category: "spot", rating: 4.6, subInfo: "거대한 고래상어가 살아 숨쉬는 초대형 해양 박물관", price: "입장료 ￥2,700", lat: 34.6545, lng: 135.4289, img: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=600&q=80" },
                    { id: "o_s7", name: "츠텐카쿠 & 신세카이", category: "spot", rating: 4.1, subInfo: "복고풍 전탑과 화려한 옛 쿠시카츠 간판 골목들", price: "전망대 ￥1,000", lat: 34.6525, lng: 135.5063, img: "https://images.unsplash.com/photo-1590559899731-a3828dfc515c?auto=format&fit=crop&w=600&q=80" }
                ]
            }
        };

        const CITY_CENTERS = {
            nagoya: { lat: 35.1709, lng: 136.8815 },
            osaka: { lat: 34.7024, lng: 135.4959 }
        };

        let userLocation = null; 
        let currentMainCategory = 'restaurant'; 
        let currentCity = 'nagoya';
        let currentFilter = 'all';
        let customDb = { restaurant: { nagoya: [], osaka: [] }, spot: { nagoya: [], osaka: [] } };

        // 로컬스토리지 연동 로드
        function loadFromLocalStorage() {
            if (localStorage.getItem('user_custom_places')) {
                try { customDb = JSON.parse(localStorage.getItem('user_custom_places')); } catch(e) {}
            }
        }
        loadFromLocalStorage();

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function formatDistance(km) {
            if (km < 1) return `${Math.round(km * 1000)}m`;
            return `${km.toFixed(1)}km`;
        }

        function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }

        // 장소 직접 추가 엔진
        function submitNewPlace() {
            const city = document.getElementById('form-city').value;
            const category = document.getElementById('form-category').value;
            const name = document.getElementById('form-name').value.trim();
            const rating = parseFloat(document.getElementById('form-rating').value) || 4.5;
            const subInfo = document.getElementById('form-subinfo').value.trim();
            const price = document.getElementById('form-price').value.trim();
            const lat = parseFloat(document.getElementById('form-lat').value) || CITY_CENTERS[city].lat;
            const lng = parseFloat(document.getElementById('form-lng').value) || CITY_CENTERS[city].lng;

            if(!name || !subInfo) {
                alert("상호명과 한줄 소개는 필수 입력 항목입니다.");
                return;
            }

            const mainCat = (category === 'spot') ? 'spot' : 'restaurant';
            const defaultImages = {
                food: "https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=600&q=80",
                dessert: "https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=600&q=80",
                spot: "https://images.unsplash.com/photo-1542931287-023b922fa89b?auto=format&fit=crop&w=600&q=80"
            };

            const newPlace = {
                id: "custom_" + Date.now(),
                name: name,
                category: category,
                rating: rating,
                subInfo: subInfo,
                price: price || "￥1,000 ~",
                lat: lat,
                lng: lng,
                img: defaultImages[category]
            };

            customDb[mainCat][city].push(newPlace);
            localStorage.setItem('user_custom_places', JSON.stringify(customDb));

            alert(`'${name}'이(가) 리스트에 추가되었습니다!`);
            closeAddModal();
            renderCards();
        }

        // 장소 삭제
        function deletePlace(id, mainCat, city) {
            if (confirm("🚨 선택하신 장소를 가이드 리스트에서 삭제하시겠습니까?")) {
                if (id.startsWith('custom_')) {
                    customDb[mainCat][city] = customDb[mainCat][city].filter(item => item.id !== id);
                    localStorage.setItem('user_custom_places', JSON.stringify(customDb));
                } else {
                    let deletedList = JSON.parse(localStorage.getItem('deleted_places') || '[]');
                    deletedList.push(id);
                    localStorage.setItem('deleted_places', JSON.stringify(deletedList));
                }
                renderCards();
            }
        }

        // --- 💾 1. 전체 백업 파일 추출 기능 (내보내기) ---
        function backupData() {
            // 브라우저 로컬스토리지에 들어있는 유저 데이터 수집
            const backupObject = {
                version: "1.0",
                exportDate: new Date().toISOString(),
                user_custom_places: localStorage.getItem('user_custom_places') || '{"restaurant":{"nagoya":[],"osaka":[]},"spot":{"nagoya":[],"osaka":[]}}',
                deleted_places: localStorage.getItem('deleted_places') || '[]',
                memos: {}
            };

            // 모든 메모 데이터 통합 수집
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('memo_')) {
                    backupObject.memos[key] = localStorage.getItem(key);
                }
            }

            // 파일화 및 다운로드 유도
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObject, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `Japan_Trip_Backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // --- 📂 2. 백업 파일 복구 기능 (가져오기) ---
        function restoreData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    if (!importedData.user_custom_places || !importedData.deleted_places) {
                        alert("⚠️ 유효하지 않은 백업 파일 양식입니다.");
                        return;
                    }

                    if (confirm("📂 백업 파일을 불러오시겠습니까? 기존에 이 브라우저에 기록되어 있던 임시 데이터는 대체됩니다.")) {
                        // 1. 기존 메모 청소
                        for (let i = localStorage.length - 1; i >= 0; i--) {
                            const key = localStorage.key(i);
                            if (key && (key.startsWith('memo_') || key === 'user_custom_places' || key === 'deleted_places')) {
                                localStorage.removeItem(key);
                            }
                        }

                        // 2. 새 데이터 할당 저장
                        localStorage.setItem('user_custom_places', importedData.user_custom_places);
                        localStorage.setItem('deleted_places', importedData.deleted_places);
                        
                        if (importedData.memos) {
                            Object.keys(importedData.memos).forEach(key => {
                                localStorage.setItem(key, importedData.memos[key]);
                            });
                        }

                        // 3. 앱 변수 동기화 및 재랜더링
                        loadFromLocalStorage();
                        renderCards();
                        alert("✨ 성공적으로 백업 데이터가 복구되었습니다!");
                    }
                } catch (err) {
                    alert("🚫 파일을 읽는 중 오류가 발생했습니다. 올바른 json/txt 파일인지 확인해 주세요.");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // 파일 인풋 초기화
        }

        function switchMainCategory(mainCat) {
            currentMainCategory = mainCat;
            const resBtn = document.getElementById('main-tab-restaurant');
            const spotBtn = document.getElementById('main-tab-spot');
            document.getElementById('category-filters').style.display = (mainCat === 'restaurant') ? 'flex' : 'none';

            if (mainCat === 'restaurant') {
                resBtn.className = "px-6 py-3 font-bold text-base border-b-2 border-red-500 text-red-600 flex items-center gap-2 transition-all";
                spotBtn.className = "px-6 py-3 font-bold text-base border-b-2 border-transparent text-gray-500 hover:text-gray-900 flex items-center gap-2 transition-all";
            } else {
                spotBtn.className = "px-6 py-3 font-bold text-base border-b-2 border-red-500 text-red-600 flex items-center gap-2 transition-all";
                resBtn.className = "px-6 py-3 font-bold text-base border-b-2 border-transparent text-gray-500 hover:text-gray-900 flex items-center gap-2 transition-all";
            }
            renderCards();
        }

        function switchCity(city) {
            currentCity = city;
            ['nagoya', 'osaka'].forEach(c => {
                document.getElementById(`tab-${c}`).className = (c === city) 
                    ? "px-6 py-2.5 rounded-lg text-sm font-bold transition-all bg-white text-gray-900 shadow-sm" 
                    : "px-6 py-2.5 rounded-lg text-sm font-bold transition-all text-gray-500 hover:text-gray-900";
            });
            renderCards();
        }

        function filterCategory(category) {
            currentFilter = category;
            ['all', 'food', 'dessert'].forEach(f => {
                document.getElementById(`filter-${f}`).className = (f === category)
                    ? "px-4 py-2 rounded-lg text-xs font-bold border border-red-500 bg-red-50 text-red-600 transition-all"
                    : "px-4 py-2 rounded-lg text-xs font-bold border border-gray-200 bg-white text-gray-600 hover:border-gray-300 transition-all";
            });
            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';

            const baseLat = userLocation ? userLocation.lat : CITY_CENTERS[currentCity].lat;
            const baseLng = userLocation ? userLocation.lng : CITY_CENTERS[currentCity].lng;

            let rawList = [...defaultDb[currentMainCategory][currentCity], ...customDb[currentMainCategory][currentCity]];
            let deletedList = JSON.parse(localStorage.getItem('deleted_places') || '[]');
            rawList = rawList.filter(item => !deletedList.includes(item.id));

            let list = rawList.map(item => {
                const dist = calculateDistance(baseLat, baseLng, item.lat, item.lng);
                return { ...item, distance: dist };
            });

            if (currentMainCategory === 'restaurant' && currentFilter !== 'all') {
                list = list.filter(item => item.category === currentFilter);
            }

            list.sort((a, b) => a.distance - b.distance);

            list.forEach((shop) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-md flex flex-col relative";
                
                const mapLink = `http://googleusercontent.com/maps.google.com/maps?q=${encodeURIComponent(shop.name + " " + (currentCity === 'nagoya' ? '나고야' : '오사카'))}`;
                const memoKey = `memo_${shop.id}`;
                const savedMemo = localStorage.getItem(memoKey) || '';

                card.innerHTML = `
                    <div class="relative overflow-hidden h-48 bg-gray-100 block group">
                        <img src="${shop.img}" alt="${shop.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://images.unsplash.com/photo-1542931287-023b922fa89b?auto=format&fit=crop&w=600&q=80'">
                        <div class="absolute top-3 left-3 flex gap-1.5 items-center z-20">
                            <span class="px-2.5 py-1 text-[10px] font-extrabold rounded-md shadow-sm ${shop.category === 'food' ? 'bg-orange-500 text-white' : shop.category === 'dessert' ? 'bg-pink-500 text-white' : 'bg-indigo-600 text-white'}">
                                ${shop.category === 'food' ? '식사 🍽️' : shop.category === 'dessert' ? '디저트 ☕' : '관광 명소 🗺️'}
                            </span>
                        </div>
                        <button onclick="deletePlace('${shop.id}', '${currentMainCategory}', '${currentCity}')" class="absolute top-3 right-3 bg-red-600 text-white p-2 rounded-xl hover:bg-red-700 shadow-md z-20 transition-all flex items-center justify-center">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                        <div class="absolute bottom-3 right-3 bg-black/70 backdrop-blur-sm text-white px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 z-20">
                            <i data-lucide="footprints" class="w-3.5 h-3.5 text-red-400"></i>
                            <span>${formatDistance(shop.distance)}</span>
                        </div>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between gap-4">
                        <div>
                            <div class="flex items-center justify-between mb-1">
                                <div class="flex items-center gap-1.5 text-amber-500 text-sm font-bold">
                                    <i data-lucide="star" class="w-4 h-4 text-amber-500 fill-amber-500"></i>
                                    <span>${shop.rating.toFixed(1)}</span>
                                </div>
                                <a href="${mapLink}" target="_blank" rel="noopener noreferrer" class="text-xs text-red-500 font-bold hover:underline flex items-center gap-0.5">
                                    <i data-lucide="map-pinned" class="w-3.5 h-3.5"></i> 구글맵 길찾기
                                </a>
                            </div>
                            <h3 class="text-base font-bold text-gray-900 line-clamp-1 mb-2">${shop.name}</h3>
                            <p class="text-sm text-gray-600 mb-1.5"><span class="text-gray-400 font-medium">소개:</span> ${shop.subInfo}</p>
                            <div class="pt-2 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500 mb-2">
                                <span>예산 / 비용</span>
                                <span class="font-bold text-gray-700 text-sm">${shop.price}</span>
                            </div>
                        </div>

                        <div class="bg-amber-50/70 border border-amber-200/60 rounded-xl p-3 text-xs">
                            <div class="font-bold text-amber-800 flex items-center gap-1 mb-1.5"><i data-lucide="sticky-note" class="w-3.5 h-3.5 text-amber-600"></i> 개인 여행 계획 메모</div>
                            <textarea id="textarea-${shop.id}" rows="2" class="w-full bg-white border border-amber-200 rounded-lg p-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-amber-400 font-medium resize-none" placeholder="방문 꿀팁 및 정기 휴무일 등을 메모해두세요.">${savedMemo}</textarea>
                            <button onclick="localStorage.setItem('memo_${shop.id}', document.getElementById('textarea-${shop.id}').value.trim()); alert('메모가 저장되었습니다!');" class="w-full mt-2 bg-amber-500 hover:bg-amber-600 text-white font-bold py-1 rounded-lg transition-colors flex items-center justify-center gap-1">저장하기</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        window.onload = () => {
            const statusEl = document.getElementById('location-status');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    statusEl.innerHTML = `<i data-lucide="check" class="text-emerald-500"></i> <span>위치 정렬 켜짐</span>`;
                    renderCards();
                }, () => {
                    statusEl.innerHTML = `<span>기본 정렬 모드</span>`;
                    renderCards();
                });
            } else { renderCards(); }
        };
    </script>
</body>
