<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Gourmet Guide - 거리 기반 추천</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen font-sans">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold flex items-center gap-2 text-red-500">
                <i data-lucide="utensils-crossed"></i> 미식 가이드
            </h1>
            <div id="location-status" class="flex items-center gap-2 bg-gray-100 text-gray-600 px-4 py-2 rounded-full text-sm font-medium transition-all">
                <i data-lucide="map-pin" class="animate-pulse text-gray-400"></i>
                <span>위치 권한을 확인 중입니다...</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div class="flex bg-gray-200 p-1 rounded-xl w-fit" id="city-tabs">
                <button onclick="switchCity('nagoya')" id="tab-nagoya" class="px-6 py-2.5 rounded-lg text-sm font-bold transition-all bg-white text-gray-900 shadow-xs">
                    나고야 🏯
                </button>
                <button onclick="switchCity('osaka')" id="tab-osaka" class="px-6 py-2.5 rounded-lg text-sm font-bold transition-all text-gray-500 hover:text-gray-900">
                    오사카 🐙
                </button>
            </div>

            <div class="flex gap-2" id="category-filters">
                <button onclick="filterCategory('all')" id="filter-all" class="px-4 py-2 rounded-lg text-xs font-bold border border-red-500 bg-red-50 text-red-600 transition-all">전체</button>
                <button onclick="filterCategory('food')" id="filter-food" class="px-4 py-2 rounded-lg text-xs font-bold border border-gray-200 bg-white text-gray-600 hover:border-gray-300 transition-all">식사</button>
                <button onclick="filterCategory('dessert')" id="filter-dessert" class="px-4 py-2 rounded-lg text-xs font-bold border border-gray-200 bg-white text-gray-600 hover:border-gray-300 transition-all">디저트/카페</button>
            </div>
        </div>

        <div id="restaurant-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <script>
        // 실제 구글맵 좌표(위도 lat, 경도 lng)가 매핑된 맛집 데이터
        const restaurants = {
            nagoya: [
                { name: "텐무스도코로 케시키 나고야점", category: "food", rating: 4.5, menu: "텐무스 (새우튀김 주먹밥)", price: "￥1,000 ~ ￥2,000", lat: 35.1706, lng: 136.8845, img: "https://images.unsplash.com/photo-1607301406259-dfb186e15de8?auto=format&fit=crop&w=600&q=80" },
                { name: "야바톤 사카에 센트라이즈점", category: "food", rating: 4.2, menu: "철판 미소카츠 (된장 돈까스)", price: "￥1,500 ~ ￥2,500", lat: 35.1678, lng: 136.9069, img: "https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?auto=format&fit=crop&w=600&q=80" },
                { name: "쿠로부타야 라무치이", category: "food", rating: 4.3, menu: "파 미소카츠", price: "￥1,500 ~ ￥2,000", lat: 35.1664, lng: 136.9063, img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80" },
                { name: "우니카와 (Unawa Meieki)", category: "food", rating: 4.6, menu: "장어구이, 히츠마부시", price: "￥3,000 ~ ￥5,000", lat: 35.1724, lng: 136.8861, img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=600&q=80" },
                { name: "라멘 레스토랑 우조무조 오스점", category: "food", rating: 4.1, menu: "특제 차슈 라멘", price: "￥1,000 ~ ￥2,000", lat: 35.1594, lng: 136.9019, img: "https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=600&q=80" },
                { name: "멘야 시시마루", category: "food", rating: 4.5, menu: "백탕 라멘 (토리파이탄)", price: "￥900 ~ ￥1,500", lat: 35.1752, lng: 136.8824, img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=600&q=80" },
                { name: "Tsubame Bread & milk 메이에키점", category: "dessert", rating: 4.2, menu: "단팥 버터 토스트", price: "￥500 ~ ￥1,500", lat: 35.1669, lng: 136.8872, img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80" },
                { name: "텐무스도코로 케시키 나고야본점", category: "food", rating: 4.4, menu: "원조 수제 텐무스", price: "￥1,000 ~ ￥2,000", lat: 35.1852, lng: 136.8614, img: "https://images.unsplash.com/photo-1534482421-64566f976cfa?auto=format&fit=crop&w=600&q=80" },
                { name: "히츠마부시 하나오카", category: "food", rating: 4.7, menu: "나고야식 장어덮밥", price: "￥3,500 ~ ￥5,000", lat: 35.1691, lng: 136.9081, img: "https://images.unsplash.com/photo-1626200419199-391ae4be7a40?auto=format&fit=crop&w=600&q=80" },
                { name: "멘야신메이 사카에스카이루점", category: "food", rating: 4.0, menu: "돈코츠 이에케이 라멘", price: "￥850 ~ ￥1,300", lat: 35.1667, lng: 136.9056, img: "https://images.unsplash.com/photo-1557872943-16a5ac26437e?auto=format&fit=crop&w=600&q=80" },
                { name: "카페 본본 (Bonbon)", category: "dessert", rating: 4.1, menu: "레트로 조각 케이크 & 푸딩", price: "￥600 ~ ￥1,200", lat: 35.1762, lng: 136.9168, img: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80" },
                { name: "요시미츠 (Yoshimitsu)", category: "dessert", rating: 4.4, menu: "와라비모찌 (전통 떡)", price: "￥500 ~ ￥1,500", lat: 35.1884, lng: 136.9312, img: "https://images.unsplash.com/photo-1582730147233-cbd81137f980?auto=format&fit=crop&w=600&q=80" },
                { name: "하브스 (HARBS) 사카에본점", category: "dessert", rating: 4.3, menu: "밀크 크레이프 케이크", price: "￥1,000 ~ ￥2,000", lat: 35.1684, lng: 136.9074, img: "https://images.unsplash.com/photo-1535141192574-5d4897c13636?auto=format&fit=crop&w=600&q=80" },
                { name: "미셸 블랑 (Michel Belin)", category: "dessert", rating: 4.3, menu: "고급 프랑스식 디저트", price: "￥1,000 ~ ￥2,500", lat: 35.1708, lng: 136.8829, img: "https://images.unsplash.com/photo-1569864358642-9d1684040f43?auto=format&fit=crop&w=600&q=80" },
                { name: "코메다 커피 BINO 사카에점", category: "dessert", rating: 3.8, menu: "시로노와르 & 모닝커피", price: "￥500 ~ ￥1,000", lat: 35.1693, lng: 136.9067, img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=600&q=80" }
            ],
            osaka: [
                { name: "규카츠 모토무라 난바점", category: "food", rating: 4.8, menu: "규카츠 정식", price: "￥1,500 ~ ￥3,000", lat: 34.6644, lng: 135.5019, img: "https://images.unsplash.com/photo-1615557960901-f2923e417fb1?auto=format&fit=crop&w=600&q=80" },
                { name: "규카츠 가츠규 난바센니치마에점", category: "food", rating: 4.7, menu: "살치살 규카츠 정식", price: "￥1,500 ~ ￥2,500", lat: 34.6651, lng: 135.5033, img: "https://images.unsplash.com/photo-1611143669185-af224c5e3252?auto=format&fit=crop&w=600&q=80" },
                { name: "아지노야 오코노미야끼", category: "food", rating: 4.3, menu: "믹스 오코노미야끼", price: "￥1,000 ~ ￥2,500", lat: 34.6675, lng: 135.5011, img: "https://images.unsplash.com/photo-1625938146369-adc83368bda7?auto=format&fit=crop&w=600&q=80" },
                { name: "grenier (그르니에) 우메다점", category: "dessert", rating: 4.5, menu: "커스터드 크림 밀푀유", price: "￥600 ~ ￥1,200", lat: 34.7032, lng: 135.4988, img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80" },
                { name: "쇼콜라티에 팔레 도르 오사카점", category: "dessert", rating: 4.4, menu: "초콜릿 파르페", price: "￥1,500 ~ ￥3,000", lat: 34.6997, lng: 135.4947, img: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80" },
                { name: "키르훼봉 그랜드 프론트 오사카점", category: "dessert", rating: 4.2, menu: "제철 과일 타르트", price: "￥800 ~ ￥1,500", lat: 34.7041, lng: 135.4944, img: "https://images.unsplash.com/photo-1535141192574-5d4897c13636?auto=format&fit=crop&w=600&q=80" },
                { name: "하브스 다이마루 우메다점", category: "dessert", rating: 4.2, menu: "밀 크레이프 케이크", price: "￥1,000 ~ ￥2,000", lat: 34.7022, lng: 135.4972, img: "https://images.unsplash.com/photo-1569864358642-9d1684040f43?auto=format&fit=crop&w=600&q=80" },
                { name: "가리겟토 (GARIGUETTE) 오사카점", category: "dessert", rating: 4.0, menu: "원형 밀프레쎄", price: "￥1,000 ~ ￥1,800", lat: 34.7047, lng: 135.4942, img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=600&q=80" }
            ]
        };

        // 기본 기준 좌표값 (유저가 위치 거부 시 사용할 나고야/오사카 중심점)
        const CITY_CENTERS = {
            nagoya: { lat: 35.1709, lng: 136.8815 },
            osaka: { lat: 34.7024, lng: 135.4959 }
        };

        let userLocation = null; // 실시간 유저 좌표 저장 변수
        let currentCity = 'nagoya';
        let currentFilter = 'all';

        // 하베신 공식(Haversine Formula)으로 실제 직선거리 계산 (km 단위 리턴)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // 지구 반지름 (km)
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // 거리 가독성 포맷팅 기능 (100m 미만, m, km 변환)
        function formatDistance(km) {
            if (km < 0.1) {
                return `${Math.round(km * 1000)}m`;
            } else if (km < 1) {
                return `${Math.round(km * 1000)}m`;
            } else {
                return `${km.toFixed(1)}km`;
            }
        }

        // 브라우저 GPS 기반 위치 탐색
        function initLocationServices() {
            const statusEl = document.getElementById('location-status');
            
            if (!navigator.geolocation) {
                statusEl.className = "flex items-center gap-2 bg-yellow-100 text-yellow-700 px-4 py-2 rounded-full text-sm font-medium";
                statusEl.innerHTML = `<i data-lucide="alert-circle"></i><span>위치 정보가 지원되지 않는 환경입니다.</span>`;
                lucide.createIcons();
                renderCards();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    // 가까운 도시 분석 후 자동 탭 선택
                    const distToNagoya = calculateDistance(userLocation.lat, userLocation.lng, CITY_CENTERS.nagoya.lat, CITY_CENTERS.nagoya.lng);
                    const distToOsaka = calculateDistance(userLocation.lat, userLocation.lng, CITY_CENTERS.osaka.lat, CITY_CENTERS.osaka.lng);

                    if (distToNagoya < distToOsaka) {
                        currentCity = 'nagoya';
                        statusEl.innerHTML = `<i data-lucide="check-circle-2" class="text-emerald-500"></i><span>현재 위치 기준 <b>나고야</b> 매장 정렬 완료!</span>`;
                    } else {
                        currentCity = 'osaka';
                        statusEl.innerHTML = `<i data-lucide="check-circle-2" class="text-emerald-500"></i><span>현재 위치 기준 <b>오사카</b> 매장 정렬 완료!</span>`;
                    }
                    statusEl.className = "flex items-center gap-2 bg-emerald-50 text-emerald-700 px-4 py-2 rounded-full text-sm font-medium border border-emerald-200";
                    
                    updateTabUI();
                    renderCards();
                },
                (error) => {
                    // 위치 정보 거부 시 기본 가이드 메시지 표기
                    statusEl.className = "flex items-center gap-2 bg-amber-50 text-amber-700 px-4 py-2 rounded-full text-sm font-medium border border-amber-200";
                    statusEl.innerHTML = `<i data-lucide="info"></i><span>위치 미승인 (각 도시역 중심 기준 거리 표시)</span>`;
                    renderCards();
                }
            );
        }

        // 상단 도시 탭 디자인 제어
        function updateTabUI() {
            ['nagoya', 'osaka'].forEach(city => {
                const tab = document.getElementById(`tab-${city}`);
                if (city === currentCity) {
                    tab.className = "px-6 py-2.5 rounded-lg text-sm font-bold transition-all bg-white text-gray-900 shadow-xs";
                } else {
                    tab.className = "px-6 py-2.5 rounded-lg text-sm font-bold transition-all text-gray-500 hover:text-gray-900";
                }
            });
        }

        function switchCity(city) {
            currentCity = city;
            updateTabUI();
            renderCards();
        }

        function filterCategory(category) {
            currentFilter = category;
            ['all', 'food', 'dessert'].forEach(f => {
                const filterBtn = document.getElementById(`filter-${f}`);
                if (f === category) {
                    filterBtn.className = "px-4 py-2 rounded-lg text-xs font-bold border border-red-500 bg-red-50 text-red-600 transition-all";
                } else {
                    filterBtn.className = "px-4 py-2 rounded-lg text-xs font-bold border border-gray-200 bg-white text-gray-600 hover:border-gray-300 transition-all";
                }
            });
            renderCards();
        }

        // 동적 카드 리스트 생성 및 정렬 렌더링 함수
        function renderCards() {
            const grid = document.getElementById('restaurant-grid');
            grid.innerHTML = '';

            // 기준이 될 중심 좌표 설정 (유저 GPS 정보가 있으면 유저 좌표 사용, 없으면 일본 해당 도시역 중심 사용)
            const baseLat = userLocation ? userLocation.lat : CITY_CENTERS[currentCity].lat;
            const baseLng = userLocation ? userLocation.lng : CITY_CENTERS[currentCity].lng;

            // 1. 선택된 도시의 매장들에 대해 거리 계산 적용
            let list = restaurants[currentCity].map(shop => {
                const dist = calculateDistance(baseLat, baseLng, shop.lat, shop.lng);
                return { ...shop, distance: dist };
            });

            // 2. 카테고리 필터링 거치기
            if (currentFilter !== 'all') {
                list = list.filter(item => item.category === currentFilter);
            }

            // 3. 내 위치에서 가장 가까운 최단거리 순서대로 정렬(Sort)
            list.sort((a, b) => a.distance - b.distance);

            if(list.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-gray-400">조건에 부합하는 매장이 없습니다.</div>`;
                return;
            }

            // 4. 카드 컴포넌트 브라우저 화면에 주입
            list.forEach((shop, index) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-md transition-all duration-200 group flex flex-col relative";
                
                // 가장 가까운 1등 매장 강조 마크업
                const distanceBadge = index === 0 && userLocation 
                    ? `<span class="bg-emerald-500 text-white text-3xs px-2 py-0.5 rounded font-bold flex items-center gap-0.5"><i data-lucide="navigation" class="w-2.5 h-2.5 fill-white"></i>최근접</span>` 
                    : '';

                card.innerHTML = `
                    <div class="relative overflow-hidden h-48 bg-gray-100">
                        <img src="${shop.img}" alt="${shop.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <div class="absolute top-3 left-3 flex gap-1.5 items-center">
                            <span class="px-2.5 py-1 text-2xs font-extrabold rounded-md shadow-xs ${shop.category === 'food' ? 'bg-orange-500 text-white' : 'bg-pink-500 text-white'}">
                                ${shop.category === 'food' ? '식사' : '디저트'}
                            </span>
                        </div>
                        <div class="absolute bottom-3 right-3 bg-black/70 backdrop-blur-xs text-white px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1">
                            <i data-lucide="footprints" class="w-3.5 h-3.5 text-red-400"></i>
                            <span>${formatDistance(shop.distance)}</span>
                        </div>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-1">
                                <div class="flex items-center gap-1.5 text-amber-500 text-sm font-bold">
                                    <i data-lucide="star" class="w-4 h-4 fill-amber-500"></i>
                                    <span>${shop.rating.toFixed(1)}</span>
                                </div>
                                ${distanceBadge}
                            </div>
                            <h3 class="text-base font-bold text-gray-900 tracking-tight line-clamp-1 mb-2">${shop.name}</h3>
                            <p class="text-sm text-gray-600 flex items-center gap-1 mb-1.5">
                                <span class="text-gray-400 font-medium">메뉴:</span> ${shop.menu}
                            </p>
                        </div>
                        <div class="pt-3 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500">
                            <span class="flex items-center gap-1"><i data-lucide="wallet" class="w-3.5 h-3.5"></i> 예산 범위</span>
                            <span class="font-bold text-gray-700 text-sm">${shop.price}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            // 화면 내 아이콘 렌더링 리프레시
            lucide.createIcons();
        }

        window.onload = () => {
            initLocationServices();
        };
    </script>
</body>
</html>
